# Default values for car_counter_chart. This is a YAML-formatted file.

replicaCount: 1

image:
  repository: "atnog-harbor.av.it.pt/dt4mob/sumo_simulator"
  tag: "latest"
  imagePullPolicy: "Always"

config:
  logLevel: "INFO"

  ditto:
    url: "dt4mob-ditto-gateway:8080"
    baseApiPath: "/api/2"
    baseWsPath: "/ws/2"

    ttlTraciCar: 2
    traciNamespace: "traci"
    traciPolicyId: "dt4mob:default"

  auth:
    authEndpoint: "https://dt4mob-keycloak:8443/auth/realms/dt4mob/protocol/openid-connect/token"
    clientId: "ditto"
    # username: ""
    # password: ""
    existingSecret: ""
    caSecret: ""
  
  mqtt:
    enabled: true
    host: "dt4mob-mqtt-broker"
    port: 1883
    topic: "telemetry"
    device: "admin"
    tenant: "dt4mob"
    reconnectInterval: 150
    tls:
      enabled: true
      caSecret: ""
      # if secret are not given the certs will be generated by the certificate service
      certSecret: ""
      
      certificateIssuer: "certificates/issue"
      subject: "admin"
      certificateTTl: 12

  
  sumo:
    zoomLevel: 18